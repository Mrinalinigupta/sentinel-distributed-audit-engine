server:
  port: 8081

spring:
  application:
    name: sentinel-audit

  # Database Configuration (PostgreSQL on dedicated port 5433)
  datasource:
    url: jdbc:postgresql://localhost:5433/sentinel_audit
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: sentinel-audit-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"

  # Redis Configuration (Redis on dedicated port 6380)
  data:
    redis:
      host: localhost
      port: 6380
      timeout: 2000ms

# Custom Sentinel Properties
sentinel:
  kafka:
    topics:
      audit-events: sentinel.audit.events.v1
      audit-events-dlq: sentinel.audit.events.v1.DLQ
  cache:
    timeline-limit: 20

# Swagger / OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
